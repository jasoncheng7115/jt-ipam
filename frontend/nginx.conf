# =============================================================================
# nginx 設定（serve Vue 3 SPA + 反向代理 /api 至 backend）
#
# 安全考量（OWASP A05）：
#   * 注入安全 headers
#   * gzip on，但對 secret-bearing response 關閉
#   * server_tokens off
# =============================================================================
server_tokens off;

map $sent_http_content_type $expires {
    default                                 off;
    text/html                               -1;
    ~image/                                 30d;
    ~font/                                  30d;
    application/javascript                  7d;
    text/css                                7d;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    expires $expires;

    # ── Security headers (A05) ──
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # HSTS 由 reverse proxy（traefik/caddy）注入；prod 部署時開啟

    # ── 健康檢查 ──
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # ── 反代 API 至 backend ──
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # ── SPA fallback ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 阻擋常見隱私洩漏路徑 ──
    location ~ /\.(env|git|svn|hg|DS_Store) {
        deny all;
        access_log off;
        return 404;
    }
}
