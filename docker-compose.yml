# =============================================================================
# jt-ipam — Compose（development / single-host）
#
# 安全考量（OWASP A05）：
#   * 服務以非 root 跑（image 內已切換）
#   * 明確 cap_drop + no-new-privileges
#   * read_only filesystem 友善（backend 用 tmpfs 給 /tmp）
#   * 不曝露 Postgres / Redis 至宿主，只在 Compose 內部網路
#   * .env 從本機讀；secrets 不寫死於本檔
#
# 正式部署建議：Helm / Proxmox LXC + 外接 Postgres HA + Redis Sentinel
# =============================================================================

name: jt-ipam

x-common-security: &common-security
  security_opt:
    - no-new-privileges:true
  read_only: false
  ulimits:
    nofile: 65536

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jt_ipam}
      POSTGRES_USER: ${POSTGRES_USER:-jt_ipam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jt_ipam} -d ${POSTGRES_DB:-jt_ipam}"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *common-security
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--save"
      - ""
      - "--appendonly"
      - "no"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    <<: *common-security
    networks: [internal]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    <<: *common-security
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    networks: [internal]
    # backend 不對外曝露；經由 frontend nginx 反代

  migrate:
    # 一次性容器：跑 alembic upgrade head 後退出
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles: ["migrate"]
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    <<: *common-security
    cap_drop:
      - ALL
    networks: [internal]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""   # 同源（透過 nginx 反代 /api）
        VITE_DEFAULT_LOCALE: ${VITE_DEFAULT_LOCALE:-zh-TW}
        VITE_DEFAULT_THEME: ${VITE_DEFAULT_THEME:-auto}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    <<: *common-security
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks: [internal]

volumes:
  postgres-data:
  redis-data:

networks:
  internal:
    driver: bridge
